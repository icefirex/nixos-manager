<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>NixOS Manager</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Boot theme — runs before the bundle so the first paint already has
      // the persisted theme (prevents a dark flash when using Latte).
      (function () {
        try {
          var raw = localStorage.getItem('nixos-manager:theme');
          var id = raw === 'latte' || raw === 'mocha' ? raw : 'mocha';
          if (id === 'system') {
            id = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'latte'
              : 'mocha';
          }
          document.documentElement.dataset.theme = id;
          if (id === 'latte') {
            document.body.style.background = '#eff1f5';
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
