name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR — the big minute-saver
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck + svelte-check + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests never run the Electron binary — skip the ~100MB download
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc, strict)
        run: npm run typecheck

      - name: Svelte-check
        run: npm run check

      - name: Tests (vitest)
        run: npm test
